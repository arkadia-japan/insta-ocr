[project]
name = "shorts-visual-transcriber"
version = "0.1.0"
description = "OCR-based text transcription for short-form videos."
requires-python = ">=3.11"
dependencies = [
  "easyocr>=1.7.1",
  "faster-whisper>=1.1.0",
  "google-api-python-client>=2.170.0",
  "google-auth>=2.40.0",
  "numpy>=1.26.0",
  "opencv-python>=4.13.0.92",
  "paddleocr>=3.4.0",
  "streamlit>=1.55.0",
  "yt-dlp>=2026.3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
shorts-visual-transcriber = "app.cli:main"
shorts-visual-transcriber-sheets = "app.sheets_sync:main"

[tool.pytest.ini_options]
pythonpath = ["."]
